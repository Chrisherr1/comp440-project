<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="app-page">

    <nav class="app-nav">
        <a class="brand" href="/home">RentFinder</a>
        <div class="nav-links">
            <a href="/home" class="active">Home</a>
            <a href="/post-rental">Post Rental</a>
            <a href="/search">Search</a>

            </a>

    <script src="/js/home.js"></script>
