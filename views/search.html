<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Rentals</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="app-page">

    <nav class="app-nav">
        <a class="brand" href="/home">RentFinder</a>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/post-rental">Post Rental</a>
            <a href="/search" class="active">Search</a>
            <a href="/write-review">Write Review</a>
            <a href="/queries">Queries</a>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="app-card wide">
            <h1>Search Rentals by Feature</h1>
            <div class="search-row">
                <input type="text" id="feature-input" placeholder="Enter a feature (e.g. pool)">
                <button class="btn-search" id="search-btn">Search</button>
            </div>
            <p id="error-message"></p>
            <div class="table-wrapper" id="results-wrapper" style="display:none;">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Posted By</th>
                            <th>City</th>
                            <th>State</th>
                            <th>$/Night</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/search.js"></script>
</body>
</html>
