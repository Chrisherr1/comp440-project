<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Rental</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="app-page">

    <nav class="app-nav">
        <a class="brand" href="/home">RentFinder</a>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/post-rental" class="active">Post Rental</a>
            <a href="/search">Search</a>
            <a href="/write-review">Write Review</a>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="app-card">
            <h1>Post a Rental Unit</h1>
            <form id="post-rental-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Cozy Downtown Studio" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Austin" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" name="state" placeholder="e.g. TX" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="price_per_night">Price per Night ($)</label>
                    <input type="number" id="price_per_night" name="price_per_night" placeholder="e.g. 120" min="0" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Describe your rental unit..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="features">Features</label>
                    <input type="text" id="features" name="features" placeholder="e.g. pool, gym, parking">
                    <p class="form-hint">Comma-separated list of features (optional)</p>
                </div>
                <p id="error-message"></p>
                <p id="success-message"></p>
                <button type="submit" class="btn-primary">Post Rental</button>
            </form>
        </div>
    </div>

    <script src="/js/post-rental.js"></script>
</body>
</html>
