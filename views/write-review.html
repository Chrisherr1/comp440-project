<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Review</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="app-page">

    <nav class="app-nav">
        <a class="brand" href="/home">RentFinder</a>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/post-rental">Post Rental</a>
            <a href="/search">Search</a>
            <a href="/write-review" class="active">Write Review</a>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="app-content">
        <div class="app-card">
            <h1>Write a Review</h1>
            <form id="review-form">
                <div class="form-group">
                    <label for="rental-id">Rental ID</label>
                    <input type="number" id="rental-id" name="rental_id" placeholder="e.g. 42" required>
                </div>
                <div class="form-group">
                    <label for="rating">Rating</label>
                    <select id="rating" name="rating" required>
                        <option value="">Select a rating...</option>
                        <option value="1">1 — Poor</option>
                        <option value="2">2 — Fair</option>
                        <option value="3">3 — Good</option>
                        <option value="4">4 — Very Good</option>
                        <option value="5">5 — Excellent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment" placeholder="Share your experience..." required></textarea>
                </div>
                <p id="error-message"></p>
                <p id="success-message"></p>
                <button type="submit" class="btn-primary">Submit Review</button>
            </form>
        </div>
    </div>

    <script src="/js/write-review.js"></script>
</body>
</html>
